name: Release Fork App
on:
  push:
    tags: [v*]

jobs:
  build:
    if: github.repository == 'danzori/yaak'
    permissions:
      contents: write

    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            os: "macos"
            yaak_arch: "arm64"
            targets: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            os: "macos"
            yaak_arch: "x64"
            targets: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            os: "ubuntu"
            yaak_arch: "x64"
            targets: ""
            args: ""
          - platform: "windows-latest"
            os: "windows"
            yaak_arch: "x64"
            targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-release
          cache-on-failure: true

      - name: Install dependencies (Linux only)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libnss3 patchelf xdg-utils
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          echo "CC_wasm32_unknown_unknown=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"

      - name: Install Protoc for plugin-runtime
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: vp install
      - run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: ${{ matrix.yaak_arch }}

      - name: Set version
        run: npm run replace-version
        env:
          YAAK_VERSION: ${{ github.ref_name }}

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          YAAK_TARGET_ARCH: ${{ matrix.yaak_arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: "node ../../node_modules/@tauri-apps/cli/tauri.js"
          projectPath: ./crates-tauri/yaak-app-client
          tagName: ${{ github.ref_name }}
          releaseName: "Yaak ${{ github.ref_name }}"
          releaseBody: "Unsigned fork build. On macOS run: xattr -dr com.apple.quarantine /Applications/Yaak.app"
          releaseDraft: false
          prerelease: false
          args: >-
            ${{ matrix.args }}
            --config ./tauri.release.conf.json
            --config '{"build":{"features":["wry"]},"app":{"security":{"capabilities":["default"]}},"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}'
